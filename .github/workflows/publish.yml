name: Publish Package
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Required for NPM Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch the previous commit as well to compare versions
          fetch-depth: 2

      - name: Check for .gitignore
        id: check_gitignore
        run: |
          if [ -s .gitignore ]; then
            echo "gitignore_exists=true" >> $GITHUB_OUTPUT
            echo ".gitignore exists and is non-empty."
          else
            echo "gitignore_exists=false" >> $GITHUB_OUTPUT
            echo "::warning::.gitignore is missing or empty. Stopping here."
          fi

      - name: Check if package.json version has changed
        id: check_version
        if: steps.check_gitignore.outputs.gitignore_exists == 'true'
        run: |
          # If github.event.before is an all-zero hash (e.g. first push), we skip comparison and assume it changed.
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
             echo "version_changed=true" >> $GITHUB_OUTPUT
             echo "Initial commit or forced push. Proceeding."
             exit 0
          fi

          # Fetch the before commit just in case it wasn't fetched
          git fetch origin ${{ github.event.before }} || true

          PREV_VERSION=$(git show ${{ github.event.before }}:package.json | jq -r .version || echo "0.0.0")
          CURR_VERSION=$(jq -r .version package.json)

          echo "Previous version: $PREV_VERSION"
          echo "Current version: $CURR_VERSION"

          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Version has changed. Proceeding."
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "::warning::Version has not changed. Stopping here."
          fi

      - name: Setup Node.js
        if: steps.check_gitignore.outputs.gitignore_exists == 'true' && steps.check_version.outputs.version_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.check_gitignore.outputs.gitignore_exists == 'true' && steps.check_version.outputs.version_changed == 'true'
        run: npm ci

      - name: Run all tests
        if: steps.check_gitignore.outputs.gitignore_exists == 'true' && steps.check_version.outputs.version_changed == 'true'
        run: npm run test:all

      - name: Publish to NPM
        if: steps.check_gitignore.outputs.gitignore_exists == 'true' && steps.check_version.outputs.version_changed == 'true'
        run: npm publish --provenance --access public
