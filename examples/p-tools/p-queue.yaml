# This script demonstrates p-queue
- ["NEW", ["pQueue", [{"concurrency": 2}], "queue"]]
- ["SET", ["results", []]]
- ["MATH", ["task1", [], "10 * 10"]]
- ["MATH", ["task2", [], "20 * 20"]]
- ["MATH", ["task3", [], "30 * 30"]]
- ["EXEC", ["$queue.add", ["$task1"], "r1"]]
- ["EXEC", ["$results.push", ["$r1"]]]
- ["EXEC", ["$queue.add", ["$task2"], "r2"]]
- ["EXEC", ["$results.push", ["$r2"]]]
- ["EXEC", ["$queue.add", ["$task3"], "r3"]]
- ["EXEC", ["$results.push", ["$r3"]]]
- ["EXEC", ["$queue.onIdle", []]]
- ["console.log", ["pQueue Results:", "$results"]]
