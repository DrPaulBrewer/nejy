# This script demonstrates p-limit
- ["EXEC", ["pLimit", [2], "limit"]]
- ["MATH", ["task1", [], "10 * 10"]]
- ["MATH", ["task2", [], "20 * 20"]]
- ["MATH", ["task3", [], "30 * 30"]]
- ["EXEC", ["$limit", ["$task1"], "res1"]]
- ["EXEC", ["$limit", ["$task2"], "res2"]]
- ["EXEC", ["$limit", ["$task3"], "res3"]]
- ["console.log", ["pLimit Results:", ["$res1", "$res2", "$res3"]]]
