# This script demonstrates p-timeout
# It restricts a promise to complete within a given time limit.

# Using PROMISE to return a bare promise. EXEC automatically awaits it and gives us the resolved value, not the promise.
- ["PROMISE", ["Promise.resolve", ["Fast Success!"]]]
- ["SET", ["fastPromise", "$LAST"]]

- ["EXEC", ["pTimeout", ["$fastPromise", {"milliseconds": 100}]]]
- ["SET", ["result", "$LAST"]]

- ["console.log", ["pTimeout Result:", "$result"]]
