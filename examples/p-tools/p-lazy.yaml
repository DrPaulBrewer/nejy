# This script demonstrates p-lazy
# It creates a lazy promise that only executes when awaited.
- ["MATH", ["lazyTask", [], "100"]]
- ["EXEC", ["pLazy.from", ["$lazyTask"], "myLazyPromise"]]
- ["console.log", ["Created lazy promise..."]]
- ["EXEC", ["Promise.all", [["$myLazyPromise"]], "result"]]
- ["console.log", ["Lazy result array:", "$result"]]
