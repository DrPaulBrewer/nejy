# health_pipe.yaml
- ["EXEC", ["console.log", ["--- 🏥 Gathering System Data ---"]]]

# Capture UTC timestamp: run a PIPE as a single code block in TO
- ["TO", ["utcTime", ["PIPE", [
    ["NEW", ["Date", []]],
    "$LAST.toISOString"
  ]]]]

- ["TO", ["host", ["os.hostname", []]]]

- ["TO", ["pct", [" 100 - (os.freemem() / os.totalmem() * 100)"]]]

- ["SET", ["entries", [
    ["hostname",          "$host"],
    ["memory_usage_pct",  "$pct"],
    ["timestamp_utc",     "$utcTime"]
  ]]]

- ["PIPE", [
    ["EXEC", ["Object.fromEntries", ["$entries"]]],
    ["EXEC", ["YAML.stringify",     ["$LAST"]]],
    ["EXEC", ["console.log",        ["\n📋 Final Health Snapshot:\n", "$LAST"]]]
  ]]
