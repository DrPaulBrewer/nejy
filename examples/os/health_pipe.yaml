# health_pipe.yaml
- ["EXEC", ["console.log", ["--- 🏥 Gathering System Data ---"]]]

# Capture UTC timestamp using CHAIN decorator: new Date().toISOString()
- ["EXEC", ["Date", [], {"chain": [["toISOString", []]], "into": "utcTime"}]]

- ["EXEC", ["os.hostname", [], "host"]]

- [" 100 - (os.freemem() / os.totalmem() * 100)", {}, "pct"]

- ["SET", ["entries", [
    ["hostname",         "$host"],
    ["memory_usage_pct", "$pct"],
    ["timestamp_utc",    "$utcTime"]
  ]]]

- ["EXEC", ["Object.fromEntries", ["$entries"], "snapshot"]]
- ["EXEC", ["YAML.stringify", ["$snapshot"], "snapshotYaml"]]
- ["EXEC", ["console.log", ["\n📋 Final Health Snapshot:\n", "$snapshotYaml"]]]
