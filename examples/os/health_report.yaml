# 🏥 System Health Report
- ["EXEC", ["os.hostname", [], "host"]]
- ["NEW",  ["Date", [], "dateObj"]]
- ["EXEC", ["$dateObj.toISOString", [], "utc"]]

# Using Math.max on an array
- ["SET", ["nums", [10, 50, 20]]]
- ["EXEC", ["Math.max.apply", [null, "$nums"], "maxVal"]]

- ["SET", ["entries", [["host", "$host"], ["time", "$utc"], ["max", "$maxVal"]]]]
- ["EXEC", ["Object.fromEntries", ["$entries"], "report"]]
- ["EXEC", ["YAML.stringify",     ["$report"],  "reportYaml"]]
- ["EXEC", ["console.log",        ["$reportYaml"]]]
