# pi.yaml — High-Speed Pi Calculation (YAML)
- ["EXEC", ["console.log", ["--- High-Speed Pi Calculation (YAML) ---"]]]
- ["SET",  ["sum", 0]]

# Pre-compile the math expression once
- ["TO", ["compiledMath", ["math.compile", ["$sum = $sum + ((-1)^$ITEM / (2 * $ITEM + 1))"]]]]

- ["DEF", [
    "ON_QUOTA",
    [
      ["EXEC", ["math.multiply", ["$sum", 4]]],
      ["EXEC", ["console.log", ["🏁 Final Pi:",   "$LAST"]]],
      ["EXEC", ["console.log", ["🔢 Iterations:", "$ITEM"]]],
      ["EXEC", ["console.log", ["📊 Usage:",      "$USAGE"]]]
    ]
  ]]

- ["FOR_EACH", [
    1000000000,
    [
      ["EXEC", ["$compiledMath.evaluate", ["$VARS"]]]
    ]
  ]]
