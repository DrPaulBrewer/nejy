# pi-pipe.yaml — High-Speed Pi Calculation (PIPE Edition)
- ["EXEC", ["console.log", ["--- High-Speed Pi Calculation (PIPE Edition) ---"]]]
- ["SET",  ["sum", 0]]

- ["TO", ["compiledMath", ["math.compile", ["$sum = $sum + ((-1)^$ITEM / (2 * $ITEM + 1))"]]]]

- ["F", [
    "ON_QUOTA",
    ["USAGE", "&VARS"],
    [
      ["PIPE", [
        ["EXEC", ["math.multiply", ["$VARS.sum", 4]]],
        ["EXEC", ["console.log",   ["🏁 Final Pi: ", "$LAST"]]]
      ]],
      ["EXEC", ["console.log", ["🔢 Iterations:", "$VARS.ITEM"]]],
      ["EXEC", ["console.log", ["📊 Usage:",      "$USAGE"]]]
    ]
  ]]

- ["FOR_EACH", [
    1000000000,
    [
      ["EXEC", ["$compiledMath.evaluate", ["$VARS"]]]
    ]
  ]]
