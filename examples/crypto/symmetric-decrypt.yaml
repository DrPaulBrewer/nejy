- [EXEC, ["fs.readFileSync", ["examples/crypto/symmetric-ciphertext-input.txt", "utf8"], "ciphertext"]]
- [SET, ["cipherObj", "$ciphertext"]]

# Robust Armor Stripping
- [EXEC, ["$cipherObj.split", ["\n\n"], "parts"]]
- [EXEC, ["$parts.at", [1], "bodyPlusCRC"]]
- [EXEC, ["$bodyPlusCRC.split", ["\n="], "b64_arr"]]
- [EXEC, ["$b64_arr.at", [0], "b64"]]

# Decode Base64 to Buffer
- [EXEC, ["Buffer.from", ["$b64", "base64"], "packet"]]

# --- RFC 4880 S2K Key Derivation ---
- [EXEC, ["$packet.subarray", [6, 14], "salt"]]
- [EXEC, ["Buffer.from", ["abcd"], "password"]]
- [EXEC, ["Buffer.concat", [["$salt", "$password"]], "material"]]

# OpenPGP S2K iteration byte 0xff -> 65,011,712 bytes iterated
- [EXEC, ["Buffer.alloc", [65011712], "itBuf"]]
- [EXEC, ["$itBuf.fill", ["$material"]]]

- [EXEC, ["Crypto.createHash", ["sha512"], "hash"]]
- [EXEC, ["$hash.update", ["$itBuf"]]]
- [EXEC, ["$hash.digest", [], "hashDigest"]]
- [EXEC, ["$hashDigest.subarray", [0, 32], "key"]]

# --- RFC 4880 OpenPGP CFB Decryption ---
- [EXEC, ["$packet.subarray", [18], "C"]]
- [EXEC, ["Buffer.alloc", [16], "zeroIV"]]
- [EXEC, ["Crypto.createDecipheriv", ["aes-256-cfb", "$key", "$zeroIV"], "dec"]]
- [EXEC, ["$dec.update", ["$C"], "updatePart"]]
- [EXEC, ["$dec.final", [], "finalPart"]]
- [EXEC, ["Buffer.concat", [["$updatePart", "$finalPart"]], "plain"]]

# Compressed Data Packet (Tag 8) starts at offset 18 of plain buffer.
- [EXEC, ["$plain.subarray", [20], "compressed"]]

# Decompress using zlib.inflateRawSync
- [EXEC, ["Zlib.inflateRawSync", ["$compressed"], "uncompressed"]]

# Literal Data Packet (Tag 11) data begins at offset 8
- [EXEC, ["$uncompressed.subarray", [8], "plaintextBuffer"]]

# Extract readable text
- [EXEC, ["$plaintextBuffer.toString", ["utf8"], "rawText"]]
- [NEW, ["RegExp", ["[\\s\\x20-\\x7E]{5,}", "g"], "rx"]]
- [EXEC, ["$rawText.match", ["$rx"], "matches"]]

- [IF, ["$matches",
    [["EXEC", ["$matches.join", [""], "joined"]], ["EXEC", ["console.log", ["\n[DECRYPTED PLAINTEXT]\n", "$joined"]]]],
    [["EXEC", ["console.log", ["Failed to decrypt or find readable text. Raw buffer length:", "$plaintextBuffer.length"]]]]
  ]]
